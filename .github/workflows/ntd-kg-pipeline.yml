name: NTD Knowledge Graph Pipeline

# Runs the BioSynth NTD pipeline on a schedule, writes ntd_graph.json /
# ntd_candidates.csv into data/, commits them back to the repo, and also
# keeps them as a downloadable workflow artifact for 90 days as a backup.
#
# SETUP (one-time):
#   1. Put this file at:            .github/workflows/ntd-kg-pipeline.yml
#   2. Put the pipeline script at:  scripts/ntd_kg_pipeline.py
#   3. Put requirements at:         scripts/requirements.txt
#   4. Repo Settings -> Actions -> General -> Workflow permissions ->
#      set to "Read and write permissions" (needed for the auto-commit step).
#   5. Push to GitHub, then trigger a manual test run from the Actions tab
#      ("Run workflow" button) before waiting for the schedule.
#
# No API keys/secrets are needed — Open Targets and ChEMBL are public,
# unauthenticated APIs.

on:
  workflow_dispatch:      # manual "Run workflow" button in the Actions tab
    inputs:
      diseases:
        description: 'Comma-separated disease names (blank = all 21 NTDs). Multi-word names are fine here, e.g. "Chagas disease,Dengue"'
        required: false
        default: ''
      include_ntd_screens:
        description: 'Also pull ChEMBL-NTD phenotypic screening hits (slower)'
        type: boolean
        default: false
      include_clinical_evidence:
        description: 'Also pull openFDA labels/FAERS + ClinicalTrials.gov trial history (slower — roughly triples API calls per drug)'
        type: boolean
        default: false
      include_literature:
        description: 'Also pull PubMed publication counts per drug-disease pair (slower)'
        type: boolean
        default: false
      include_burden:
        description: 'Also pull WHO GHO disease burden (case counts) per disease'
        type: boolean
        default: false
      expert_annotations_path:
        description: 'Path in this repo to a human-curated expert-annotations CSV (patent status, EML, resistance, manufacturing notes). Leave blank to skip — see scripts/report_generator.py docstring for the expected columns.'
        required: false
        default: ''
      other_diseases:
        description: 'Comma-separated cancer/rare-disease names for cross-domain target overlap detection (blank = skip this step entirely). Example: "Breast cancer,Cystic fibrosis"'
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC — adjust to taste

permissions:
  contents: write         # required so the workflow can commit data/ back

jobs:
  build-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 60    # the full 21-disease pull can take a while; adjust if you see timeouts

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run pipeline
        id: run
        env:
          # Passed as env vars (not interpolated straight into the run
          # script) specifically so a multi-word value like "Chagas disease"
          # can't get word-split by the shell before Python sees it — that
          # exact bug produced a broken graph on the first live run.
          DISEASES_INPUT: ${{ github.event.inputs.diseases }}
          INCLUDE_SCREENS: ${{ github.event.inputs.include_ntd_screens }}
          INCLUDE_CLINICAL: ${{ github.event.inputs.include_clinical_evidence }}
          INCLUDE_LITERATURE: ${{ github.event.inputs.include_literature }}
          INCLUDE_BURDEN: ${{ github.event.inputs.include_burden }}
          EXPERT_PATH: ${{ github.event.inputs.expert_annotations_path }}
        run: |
          mkdir -p data
          ARGS=""
          if [ -n "$DISEASES_INPUT" ]; then
            ARGS="$ARGS --diseases-csv \"$DISEASES_INPUT\""
          fi
          if [ "$INCLUDE_SCREENS" = "true" ]; then
            ARGS="$ARGS --include-ntd-screens"
          fi
          if [ "$INCLUDE_CLINICAL" = "true" ]; then
            ARGS="$ARGS --include-clinical-evidence"
          fi
          if [ "$INCLUDE_LITERATURE" = "true" ]; then
            ARGS="$ARGS --include-literature"
          fi
          if [ "$INCLUDE_BURDEN" = "true" ]; then
            ARGS="$ARGS --include-burden"
          fi
          if [ -n "$EXPERT_PATH" ]; then
            if [ -f "$EXPERT_PATH" ]; then
              ARGS="$ARGS --expert-annotations-csv \"$EXPERT_PATH\""
            else
              echo "::warning::expert_annotations_path '$EXPERT_PATH' not found in repo — skipping, running without it"
            fi
          fi
          eval python scripts/ntd_kg_pipeline.py \
            --out data/ntd_graph.json \
            --csv data/ntd_candidates.csv \
            $ARGS

      - name: Generate research brief
        run: python scripts/report_generator.py --csv data/ntd_candidates.csv --out data/ntd_report.md

      - name: Run pipeline for cross-domain comparison diseases
        if: ${{ github.event.inputs.other_diseases != '' }}
        env:
          OTHER_DISEASES: ${{ github.event.inputs.other_diseases }}
        run: |
          python scripts/ntd_kg_pipeline.py \
            --diseases-csv "$OTHER_DISEASES" \
            --out data/other_graph.json \
            --csv data/other_candidates.csv

      - name: Detect cross-domain target overlap
        if: ${{ github.event.inputs.other_diseases != '' }}
        run: |
          python scripts/cross_domain_overlap.py \
            --graph-a data/ntd_graph.json --candidates-a data/ntd_candidates.csv --label-a NTD \
            --graph-b data/other_graph.json --candidates-b data/other_candidates.csv --label-b Other \
            --out data/cross_domain_overlap.md

      - name: Upload as workflow artifact (backup / review before merge)
        uses: actions/upload-artifact@v4
        with:
          name: ntd-graph-${{ github.run_number }}
          path: |
            data/ntd_graph.json
            data/ntd_candidates.csv
            data/ntd_report.md
            data/other_graph.json
            data/other_candidates.csv
            data/cross_domain_overlap.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit updated graph data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh NTD knowledge graph data [automated]"
          # Wildcards rather than exact filenames — the cross-domain files
          # only exist when other_diseases was set this run, and git-add on
          # an explicit nonexistent path fails the step; a glob just matches
          # whatever's actually there.
          file_pattern: "data/*.json data/*.csv data/*.md"
